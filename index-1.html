<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E2E Human Capital Solutions</title>
<meta name="description" content="E2E Human Capital Solutions: recruitment, headhunting, executive search and HR support across Egypt and the GCC. Employee to employer, synced full circle.">
<meta name="theme-color" content="#0F4C5C">
<meta property="og:type" content="website">
<meta property="og:site_name" content="E2E Human Capital Solutions">
<meta property="og:title" content="E2E Human Capital Solutions">
<meta property="og:description" content="Your End-to-End talent partner across Egypt and the GCC. Employee to employer, synced full circle.">
<meta property="og:url" content="https://www.e2e-humancapital.com/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%27124%2030%20132%20120%27%3E%3Crect%20x=%27110%27%20y=%2720%27%20width=%27160%27%20height=%27140%27%20rx=%2724%27%20fill=%27%230A3038%27/%3E%3Ccircle%20cx=%27190%27%20cy=%2790%27%20r=%2752%27%20fill=%27none%27%20stroke=%27%23C9A227%27%20stroke-width=%2712%27%20stroke-dasharray=%27230%2097%27%20stroke-linecap=%27round%27%20transform=%27rotate%28-60%20190%2090%29%27/%3E%3Ccircle%20cx=%27190%27%20cy=%2790%27%20r=%2752%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-width=%2712%27%20stroke-dasharray=%2770%20257%27%20stroke-dashoffset=%27-260%27%20stroke-linecap=%27round%27%20transform=%27rotate%28-60%20190%2090%29%27/%3E%3Ccircle%20cx=%27138%27%20cy=%2790%27%20r=%2712%27%20fill=%27%23C9A227%27/%3E%3Ccircle%20cx=%27242%27%20cy=%2790%27%20r=%2712%27%20fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --cream:#F4ECDA; --cream2:#EFE3CB; --ink:#2B2420; --mute:#6B6153;
  --teal:#0F4C5C; --teal-d:#0B3A46; --teal-deep:#0A3038; --amber:#C9A227; --amber-d:#A8841C;
  --line:#E3D7BC; --card:#FBF6E9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:#F8F0DD;color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
svg{display:block}
img{max-width:100%}
.serif{font-family:"Playfair Display",Georgia,serif}
.wrap{max-width:1140px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}

/* ---- nav ---- */
.nav{position:sticky;top:0;z-index:40;background:var(--cream);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1140px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto;cursor:pointer}
.brand .mark{width:68px;flex:none}
.brand b{font-size:16px;letter-spacing:.02em;color:var(--teal);font-weight:700}
.two{font-style:normal;color:var(--amber)}
.brand small{display:block;font-size:7.5px;letter-spacing:.14em;color:var(--mute);font-weight:600}
.brand .slg{display:block;font-style:normal;font-size:9.5px;color:var(--teal);font-weight:500;margin-top:3px;letter-spacing:.01em}
.navlinks{display:flex;gap:26px;font-size:14.5px;font-weight:500;color:#3A332C}
.navlinks a{opacity:.72;padding-bottom:4px;border-bottom:2px solid transparent}
.navlinks a:hover{opacity:1}
.navlinks a.active{opacity:1;border-color:var(--amber);color:var(--teal);font-weight:600}
.cta-top{background:var(--teal);color:#fff;font-weight:600;font-size:14px;padding:12px 20px;border-radius:4px;white-space:nowrap}
.cta-top:hover{background:var(--teal-d)}
.burger{display:none;background:none;border:0;padding:8px;margin-inline-start:2px;cursor:pointer}
.burger span{display:block;width:22px;height:2px;background:var(--teal);margin:5px 0;transition:transform .2s,opacity .2s}
.nav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav.open .burger span:nth-child(2){opacity:0}
.nav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobmenu{display:none;border-top:1px solid var(--line);background:var(--cream);padding:6px 20px 18px}
.mobmenu a{display:block;padding:14px 4px;font-size:16px;font-weight:500;border-bottom:1px solid var(--line)}
.mobmenu a.active{color:var(--teal);font-weight:700}
.mobmenu a.mob-cta{margin-top:16px;text-align:center;background:var(--teal);color:#fff;border-radius:6px;border:0;font-weight:600}
@media (max-width:860px){.navlinks,.cta-top{display:none}.burger{display:block}.nav.open .mobmenu{display:block}}

/* ---- hero ---- */
.hero{position:relative;color:#fff;overflow:hidden;min-height:620px;display:flex;align-items:flex-end}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#143F4C,#0F4C5C 55%,#1C2B30 100%);z-index:0}
.hero-bg.has-img{background-size:cover;background-position:center}
.hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,20,18,.78) 10%,rgba(15,20,18,.38) 55%,rgba(15,20,18,.15) 100%)}
.hero-dots{position:absolute;right:-60px;top:-60px;width:360px;height:360px;border-radius:50%;border:2px solid rgba(201,162,39,.3);z-index:0}
.hero-dots:before{content:"";position:absolute;inset:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18)}
.hero-inner{position:relative;z-index:1;padding:64px 28px 56px;max-width:1140px;margin:0 auto;width:100%}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.22em;color:#E7DCC2;margin:0 0 18px}
.hero h1{font-size:50px;line-height:1.14;margin:0 0 20px;max-width:20ch;font-weight:600;text-wrap:balance}
.hero p.lead{font-size:17px;max-width:56ch;color:#F1EADA;margin:0 0 30px}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:4px;font-weight:600;font-size:15px;cursor:pointer;border:none}
.btn-amber{background:var(--amber);color:#2B2420}
.btn-amber:hover{background:var(--amber-d)}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn-outline:hover{border-color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-d)}

/* ---- page header (inner pages) ---- */
.pagehead{background:var(--teal);color:#fff;padding:54px 0 42px;position:relative;overflow:hidden}
.pagehead .ring{position:absolute;right:-40px;top:-50px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(201,162,39,.28)}
.pagehead .eyebrow{color:#CDE3E6;margin-bottom:10px}
.pagehead h1{font-size:36px;margin:0;font-weight:600;position:relative;z-index:1}
.pagehead p{color:#D9E8EA;max-width:56ch;margin:12px 0 0;font-size:15.5px;position:relative;z-index:1}

/* ---- sections ---- */
section{padding:72px 0}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--amber-d);margin:0 0 8px}
h2{font-size:30px;margin:0 0 14px;font-weight:600}
h2.bold-head{font-weight:800;font-size:36px;letter-spacing:-.01em}
.section-head{max-width:640px;margin:0 auto 42px;text-align:center}
.section-head p{color:var(--mute);font-size:15.5px;margin:0}

.grid{display:grid;gap:22px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;transition:box-shadow .15s,transform .15s}
.card.clickable{cursor:pointer}
.card.clickable:hover{box-shadow:0 10px 24px rgba(15,20,18,.08);transform:translateY(-2px)}
.card .ico{width:46px;height:46px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.card h3{font-size:17px;margin:0 0 8px;color:var(--teal)}
.card p{font-size:14px;color:var(--mute);margin:0 0 10px}
.card .more{font-size:13px;font-weight:600;color:var(--amber-d)}

.band{background:var(--teal);color:#fff}
.band .section-head p{color:#CFE3E7}
.diff .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.diff .card h3{color:#fff}
.diff .card p{color:#D7E6E8;margin:0}
.diff .ico{background:rgba(201,162,39,.18)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.split>*{min-width:0}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.valuelist{list-style:none;margin:0;padding:0}
.valuelist li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.valuelist li b{color:var(--teal);min-width:112px;display:inline-block}

.contact-card{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:30px}
.contact-card h4{margin:0 0 4px;font-size:13px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.contact-card a,.contact-card p{display:block;font-size:16px;color:var(--teal);margin:0 0 18px;font-weight:600}

.tabswitch{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:30px;padding:4px;margin-bottom:26px;gap:4px}
.tabswitch a{padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;color:var(--mute)}
.tabswitch a.active{background:var(--teal);color:#fff}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px}
.form-card h3{margin:0 0 6px;font-size:19px;color:var(--teal)}
.form-card>p.hint{margin:0 0 22px;font-size:14px;color:var(--mute)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--mute);text-transform:uppercase}
.field input[type=text],.field input[type=email],.field input[type=tel],.field textarea{font:inherit;font-size:14.5px;padding:11px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:100px}
.field input:focus,.field textarea:focus{outline:2px solid var(--amber);outline-offset:1px}
.file-field{border:1.5px dashed var(--line);border-radius:8px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--cream)}
.file-field .fname{font-size:13.5px;color:var(--mute);flex:1}
.file-field label.pick{background:var(--teal);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;flex:none}
.form-note{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.form-status{font-size:13.5px;font-weight:600;margin-top:14px;min-height:18px}
.form-status.ok{color:var(--teal)}
.form-status.err{color:#B3261E}
.field input,.field textarea{width:100%;min-width:0}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

.dualpath{background:var(--cream);position:relative;background-image:radial-gradient(rgba(15,76,92,.09) 1.4px, transparent 1.4px);background-size:16px 16px}
.dualpath .wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:34px 28px}
@media (max-width:720px){.dualpath .wrap{grid-template-columns:1fr}}
.dpcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 26px;display:flex;align-items:center;gap:16px;transition:box-shadow .15s,transform .15s}
.dpcard:hover{box-shadow:0 10px 24px rgba(15,20,18,.1);transform:translateY(-2px)}
.dpcard .dpico{width:48px;height:48px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none}
.dpcard .body{flex:1}
.dpcard h4{margin:0 0 4px;font-size:17px;color:var(--teal)}
.dpcard p{margin:0;font-size:13.5px;color:var(--mute)}
.dpcard .go{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.dpcard:hover .go{background:var(--amber);color:#2B2420}
.wave{display:block;width:100%;height:46px;margin-top:-1px}

.ribbon{height:5px;border-radius:5px 5px 0 0;background:linear-gradient(90deg,var(--teal),var(--amber));margin:-26px -26px 18px}
.card{position:relative}

.grid.vals{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid.vals{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid.vals{grid-template-columns:minmax(0,1fr)}}
.about{text-align:center}
.about-h{font-size:38px;line-height:1.18;max-width:28ch;margin:0 auto 18px;text-wrap:balance}
.about-h:after{content:"";display:block;width:64px;height:4px;border-radius:4px;background:var(--amber);margin:16px auto 0}
.about-p{font-size:17px;color:var(--mute);max-width:58ch;margin:0 auto 24px}
.about-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.about-chips span{background:var(--card);border:1px solid var(--line);color:var(--teal);font-size:13px;font-weight:600;padding:8px 16px;border-radius:30px}
.about-chips span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-inline-end:8px}

footer.site{background:var(--teal-deep);color:#EFE6D2;padding:56px 0 28px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
@media (max-width:720px){.foot-grid{grid-template-columns:1fr}}
.foot-brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.foot-brand b{font-size:15px;color:#fff}
.foot-brand .mark{width:72px;height:auto;flex:none}
.foot-grid.foot4{grid-template-columns:1.3fr 1fr 1fr 1fr}
@media (max-width:900px){.foot-grid.foot4{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.foot-grid.foot4{grid-template-columns:1fr}}
footer.site h4{font-size:13px;letter-spacing:.1em;color:#C9A227;margin:0 0 12px;text-transform:uppercase}
footer.site p,footer.site a{font-size:14px;color:#E7DCC8;margin:0 0 8px;display:block}
footer.site a:hover{color:#fff}
.foot-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:18px;font-size:12.5px;color:#C9BBA2;text-align:center}

/* ---- mobile refinements ---- */
@media (max-width:640px){
  .wrap{padding:0 20px}
  .nav-inner{padding:10px 20px;gap:10px}
  .brand .mark{width:54px}
  .brand b{font-size:17px}
  .brand small{font-size:6.5px;letter-spacing:.1em}
  .brand .slg{font-size:8.5px}
  section{padding:48px 0}
  .hero{min-height:0}
  .hero-inner{padding:56px 20px 44px}
  .hero h1{font-size:34px;max-width:none}
  .hero p.lead{font-size:15.5px;margin-bottom:24px}
  .hero-ctas .btn{flex:1 1 100%;justify-content:center}
  .hero-dots{width:240px;height:240px;right:-100px;top:-100px}
  .eyebrow{font-size:11.5px;letter-spacing:.16em}
  .pagehead{padding:40px 0 32px}
  .pagehead h1{font-size:28px}
  .pagehead p{font-size:14.5px}
  h2{font-size:25px}
  h2.bold-head{font-size:28px}
  .about-h{font-size:28px}
  .about-p{font-size:15.5px}
  .section-head{margin-bottom:28px}
  .card{padding:22px}
  .ribbon{margin:-22px -22px 16px}
  .dualpath .wrap{padding:24px 20px;gap:14px}
  .dpcard{padding:18px;gap:12px}
  .valuelist li{flex-direction:column;gap:2px}
  .valuelist li b{min-width:0}
  .tabswitch{display:flex;width:100%}
  .tabswitch a{flex:1;text-align:center;padding:10px 6px;font-size:13px}
  .form-card{padding:22px 18px}
  .contact-card{padding:24px}
  .field input[type=text],.field input[type=email],.field input[type=tel],.field textarea{font-size:16px}
  .file-field{flex-wrap:wrap}
  .btn{padding:13px 20px}
  footer.site{padding:44px 0 24px}
  .edit-fab{right:12px;bottom:12px}
  .img-upload{left:20px;bottom:16px}
}

/* ---- editable affordances ---- */
[data-field]{outline:none;border-radius:4px}
.editing [data-field]{cursor:text;min-width:1ch;min-height:1em}
.editing [data-field]:focus{box-shadow:0 0 0 3px rgba(201,162,39,.95);background:rgba(201,162,39,.18)}
body.editing{padding-bottom:96px}
.editing [data-field]{box-shadow:0 0 0 2px rgba(201,162,39,.55);background:rgba(201,162,39,.08)}
.edit-fab{position:fixed;right:22px;bottom:22px;z-index:100;display:flex;gap:10px;align-items:center}
.edit-fab button{border:none;cursor:pointer;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;border-radius:30px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.edit-fab .start{background:var(--teal);color:#fff}
.edit-fab .save{background:var(--amber);color:#2B2420}
.edit-fab .cancel{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.edit-fab .status{font-size:12.5px;color:#fff;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:20px}
.img-upload{position:absolute;left:28px;bottom:28px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,.4)}
.hidden{display:none !important}
@media (max-width:640px){
  .edit-fab{left:12px;right:12px;bottom:12px;flex-wrap:wrap;justify-content:center}
  .edit-fab .status{flex:1 1 100%;text-align:center}
  .edit-fab .cancel,.edit-fab .save{flex:1;padding:13px 14px}
  .edit-fab .start{padding:13px 22px}
}

/* ---- language switch + Arabic / RTL ---- */
.langbtn{border:1.5px solid var(--teal);background:transparent;color:var(--teal);font-family:inherit;font-weight:600;font-size:13px;line-height:1;border-radius:30px;padding:9px 15px;cursor:pointer;margin-inline:6px 10px;white-space:nowrap}
.langbtn:hover{background:var(--teal);color:#fff}
.mobmenu .langbtn{display:block;width:100%;margin:12px 0 0;padding:12px;font-size:15px;border-radius:6px}
html[dir=rtl] body{font-family:Cairo,Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.8}
html[dir=rtl] .serif,html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] h4,html[dir=rtl] .form-card h3{font-family:Cairo,"Playfair Display",sans-serif}
html[dir=rtl] *{letter-spacing:0 !important}
html[dir=rtl] h1,html[dir=rtl] h2{line-height:1.35}
html[dir=rtl] .brand b{font-family:"Playfair Display",Georgia,serif}
html[dir=rtl] .brand .slg{font-size:10.5px}html[dir=rtl] .brand small{font-size:9px}
html[dir=rtl] .eyebrow,html[dir=rtl] .kicker{font-size:13.5px}
html[dir=rtl] .about-h{max-width:26ch}
html[dir=rtl] a[dir=ltr]{text-align:right;unicode-bidi:isolate}
html[dir=rtl] input[type=email],html[dir=rtl] input[type=tel]{direction:ltr;text-align:right}
html[dir=rtl] .hero-dots,html[dir=rtl] .pagehead .ring{right:auto;left:-60px}
html[dir=rtl] .img-upload{left:auto;right:28px}
@media (max-width:640px){ html[dir=rtl] .img-upload{right:20px;left:auto} }
a:focus-visible,button:focus-visible,.langbtn:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
.hp{position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;clip:rect(0 0 0 0);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<script id="site-state" type="application/json">
{
  "eyebrow": "HUMAN CAPITAL SOLUTIONS",
  "heroTitle": "Your End-to-End Talent Partner Across Egypt & the GCC",
  "heroLead": "We partner with ambitious companies to solve their hardest talent challenges, from headhunting and executive search to full workforce support.",
  "heroImageId": null,
  "aboutHeadline": "We don't just fill roles. We build teams that last.",

        <p style="color:#CFE3E7;margin-bottom:24px">${t('ready_p')}</p>
        <a class="btn btn-amber" href="#/contact">${t('cta')} ${t('arr')}</a>
      </div>
    </section>
    `;
  }

  function pageAbout(state){
    return pagehead(t('k_aboutus'), t('about_title'), state.aboutText) + `
    <section>
      <div class="wrap">
        <div class="section-head">
          <p class="kicker">${t('k_exp')}</p>
          <h2>${t('h_exp')}</h2>
        </div>
        <div class="grid g3">
          ${(state.exp||[]).map((x,i)=>`
          <div class="card"><div class="ribbon"></div>
            <div class="ico">${ICONS[EXP_ICONS[i%3]]}</div>
            <h3 data-field="exp.${i}.title">${esc(x.title)}</h3>
            <p data-field="exp.${i}.text">${esc(x.text)}</p>
          </div>`).join('')}
        </div>
      </div>
    </section>
    <section style="padding-top:0">
      <div class="wrap split">
        <div>
          <p class="kicker">${t('k_vision')}</p>
          <p data-field="vision" style="font-size:16px">${esc(state.vision)}</p>
        </div>
        <div>
          <p class="kicker">${t('k_mission')}</p>
          <p data-field="mission" style="font-size:16px">${esc(state.mission)}</p>
        </div>
      </div>
    </section>
    <section style="padding-top:0">
      <div class="wrap">
        <div class="section-head">
          <p class="kicker">${t('k_stand')}</p>
          <h2>${t('h_values')}</h2>
          <p>${t('p_values')}</p>
        </div>
        <div class="grid vals">
          ${state.values.map((v,i)=>`
          <div class="card"><div class="ribbon"></div>
            <div class="ico">${ICONS[VALUE_ICONS[i%6]]}</div>
            <h3 data-field="values.${i}.title">${esc(v.title)}</h3>
            <p data-field="values.${i}.text">${esc(v.text)}</p>
          </div>`).join('')}
        </div>
      </div>
    </section>
    <section class="band diff" style="padding-top:56px">
      <div class="wrap">
        <div class="section-head">
          <p class="kicker" style="color:#C9A227">${t('k_why')}</p>
          <h2 class="bold-head">${t('h_diff')}</h2>
        </div>
        <div class="grid g4">
          ${state.diffs.map((d,i)=>`
          <div class="card">
            <div class="ico">${ICONS[DIFF_ICONS[i%4]]}</div>
            <h3 data-field="diffs.${i}.title">${esc(d.title)}</h3>
            <p data-field="diffs.${i}.text">${esc(d.text)}</p>
          </div>`).join('')}
        </div>
      </div>
    </section>
    `;
  }

  const endpointOn = () => /^https:\/\//.test((state.formEndpoint || '').trim());
  const honeypot = () => endpointOn() ? '<input type="text" id="hp" class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">' : '';

  function hireFormHtml(){
    return `<div class="form-card">
      <h3>${t('h_title')}</h3>
      <p class="hint">${t('h_hint')}</p>
      <div class="form-grid">
        <div class="field"><label for="hireCompany">${t('h_company')}</label><input type="text" id="hireCompany" autocomplete="organization" maxlength="160" placeholder="${t('h_company_ph')}"></div>
        <div class="field"><label for="hireName">${t('h_contact')}</label><input type="text" id="hireName" autocomplete="name" maxlength="160" placeholder="${t('name_ph')}"></div>
        <div class="field"><label for="hireEmail">${t('h_email')}</label><input type="email" id="hireEmail" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="160" placeholder="you@company.com"></div>
        <div class="field"><label for="hirePhone">${t('f_phone')}</label><input type="tel" id="hirePhone" autocomplete="tel" inputmode="tel" maxlength="160" placeholder="+20 ..."></div>
        <div class="field full"><label for="hireRole">${t('h_role')}</label><input type="text" id="hireRole" maxlength="160" placeholder="${t('h_role_ph')}"></div>
        <div class="field full"><label for="hireMsg">${t('f_msg')}</label><textarea id="hireMsg" maxlength="2000" placeholder="${t('h_msg_ph')}"></textarea></div>
      </div>
      ${honeypot()}
      <button type="button" class="btn btn-teal" id="hireBtn">${t('h_btn')} ${t('arr')}</button>
      <div class="form-status" id="hireStatus"></div>
      <p class="form-note">${endpointOn() ? t('h_note_on') : t('h_note')}</p>
    </div>`;
  }

  function applyFormHtml(){
    return `<div class="form-card">
      <h3>${t('a_title')}</h3>
      <p class="hint">${t('a_hint')}</p>
      <div class="form-grid">
        <div class="field"><label for="applyName">${t('a_name')}</label><input type="text" id="applyName" autocomplete="name" maxlength="160" placeholder="${t('name_ph')}"></div>
        <div class="field"><label for="applyEmail">${t('a_email')}</label><input type="email" id="applyEmail" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="160" placeholder="you@email.com"></div>
        <div class="field"><label for="applyPhone">${t('f_phone')}</label><input type="tel" id="applyPhone" autocomplete="tel" inputmode="tel" maxlength="160" placeholder="+20 ..."></div>
        <div class="field"><label for="applyRole">${t('a_role')}</label><input type="text" id="applyRole" maxlength="160" placeholder="${t('a_role_ph')}"></div>
        <div class="field full"><label for="applyMsg">${t('f_msg')}</label><textarea id="applyMsg" maxlength="2000" placeholder="${t('a_msg_ph')}"></textarea></div>
        ${endpointOn()
          ? `<div class="field full"><label for="applyLink">${t('a_link')}</label><input type="url" id="applyLink" inputmode="url" autocapitalize="off" spellcheck="false" maxlength="300" placeholder="${t('a_link_ph')}"></div>`
          : `<div class="field full">
          <label>${t('a_cv')}</label>
          <div class="file-field">
            <label class="pick" for="applyFile">${t('a_choose')}</label>
            <input type="file" id="applyFile" accept=".pdf,.doc,.docx" style="display:none">
            <span class="fname" id="applyFileName">${t('nofile')}</span>
          </div></div>`}
      </div>
      ${honeypot()}
      <button type="button" class="btn btn-amber" id="applyBtn">${t('a_btn')} ${t('arr')}</button>
      <div class="form-status" id="applyStatus"></div>
      <p class="form-note">${endpointOn() ? t('a_note_on') : t('a_note')}</p>
    </div>`;
  }

  function pageContact(state){
    const tab = getContactTab();
    const title = tab === 'apply' ? t('c_apply_t') : t('c_hire_t');
    const sub = tab === 'apply' ? t('c_apply_s') : t('c_hire_s');
    return pagehead(t('k_touch'), title, sub) + `
    <section>
      <div class="wrap" style="max-width:980px">
        <div class="tabswitch">
          <a href="#/contact" class="${tab==='hire'?'active':''}">${t('tab_hire')}</a>
          <a href="#/contact-apply" class="${tab==='apply'?'active':''}">${t('tab_apply')}</a>
        </div>
        <div class="split" style="align-items:start">
          <div>${tab==='apply' ? applyFormHtml() : hireFormHtml()}</div>
          <div>
            <div class="contact-card">
              <h4>${t('l_phone')}</h4>
              <a dir="ltr" data-field="contactPhone" href="${telHref(state.contactPhone)}">${esc(state.contactPhone)}</a>
              <h4>${t('l_email')}</h4>
              <a dir="ltr" data-field="contactEmail" href="${mailHref(state.contactEmail)}">${esc(state.contactEmail)}</a>
              <h4>${t('l_address')}</h4>
              <p data-field="contactAddress">${esc(state.contactAddress)}</p>
              <h4>${t('l_web')}</h4>
              <a dir="ltr" data-field="contactWebsite" href="${webHref(state.contactWebsite)}" target="_blank" rel="noopener">${esc(state.contactWebsite)}</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    `;
  }

  const PAGES = {home:pageHome, services:pageServices, about:pageAbout, contact:pageContact};

  function renderBody(state, route){
    route = route || getRoute();
    const v = viewOf(state);
    return `${navHtml(route)}
    <main id="page">${PAGES[route](v)}</main>
    ${footerHtml(v)}
    <div class="edit-fab" id="editFab"></div>`;
  }

  function renderDoc(state, route){
    return `<!DOCTYPE html>
<html lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}">
<head>${HEAD_HTML}</head>
<body>
<div id="app">${renderBody(state, route||'home')}</div>
<script id="site-state" type="application/json">${JSON.stringify(state)}<\/script>
<script id="head-src" type="application/json">${JSON.stringify(HEAD_HTML).replace(/</g,'\\u003c')}<\/script>
${document.getElementById('logic-script').outerHTML}
</body>
</html>`;
  }

  function getByPath(obj, path){
    return path.split('.').reduce((o,k)=> o==null?o:o[/^\d+$/.test(k)?+k:k], obj);
  }
  function setByPath(obj, path, val){
    const parts = path.split('.');
    let o = obj;
    for (let i=0;i<parts.length-1;i++){ const k = /^\d+$/.test(parts[i])?+parts[i]:parts[i]; o = o[k]; }
    const last = parts[parts.length-1];
    o[/^\d+$/.test(last)?+last:last] = val;
  }

  let state = JSON.parse(document.getElementById('site-state').textContent);
  let editing = false;

  function paint(){
    applyLang();
    APP.innerHTML = renderBody(state);
    wireUploadButton();
    wireContactForm();
    wireNav();
    paintFab();
    if (editing){ applyEditing(); }
  }

  function setLang(){
    if (editing) harvest();
    lang = lang === 'ar' ? 'en' : 'ar';
    try{ localStorage.setItem('e2e-lang', lang); }catch(e){}
    paint();
  }

  function wireNav(){
    const nav = document.getElementById('nav');
    const burger = document.getElementById('burger');
    if (!nav || !burger) return;
    burger.onclick = function(){
      const open = nav.classList.toggle('open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    nav.querySelectorAll('.mobmenu a').forEach(a=>{ a.addEventListener('click', ()=>nav.classList.remove('open')); });
    nav.querySelectorAll('[data-lang-toggle]').forEach(b=>{ b.onclick = setLang; });
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  function setStatus(id, msg, kind){
    const st = document.getElementById(id);
    if (!st) return;
    st.textContent = msg;
    st.classList.remove('ok','err');
    st.classList.add(kind);
  }
  function openMailto(subject, lines){
    const body = lines.filter(l => l !== null && l !== undefined).join('\n');
    window.location.href = `mailto:${state.contactEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  async function submitRemote(payload, statusId, btnId, okKey){
    if (val('hp')) return setStatus(statusId, t(okKey), 'ok');
    const btn = document.getElementById(btnId);
    const label = btn ? btn.innerHTML : '';
    if (btn){ btn.disabled = true; btn.textContent = t('sending'); }
    setStatus(statusId, '', 'ok');
    try{
      const r = await fetch(state.formEndpoint.trim(), {
        method: 'POST',
        headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error('send failed');
      setStatus(statusId, t(okKey), 'ok');
      document.querySelectorAll('.form-card input:not([type=file]), .form-card textarea').forEach(el => { el.value = ''; });
    }catch(e){
      setStatus(statusId, t('e_send', state.contactEmail), 'err');
    }
    const b2 = document.getElementById(btnId);
    if (b2){ b2.disabled = false; b2.innerHTML = label; }
  }

  function wireContactForm(){
    const hireBtn = document.getElementById('hireBtn');
    if (hireBtn){
      hireBtn.onclick = function(){
        const company = val('hireCompany'), name = val('hireName'), email = val('hireEmail');
        const phone = val('hirePhone'), role = val('hireRole'), msg = val('hireMsg');
        if (!company && !name) return setStatus('hireStatus', t('e_hire_who'), 'err');
        if (!EMAIL_RE.test(email)) return setStatus('hireStatus', t('e_email_hire'), 'err');
        if (!role && !msg) return setStatus('hireStatus', t('e_hire_role'), 'err');
        if (endpointOn()) return submitRemote({
          _subject: `Hiring inquiry${company ? ': ' + company : ''}`, form_type: 'Hiring inquiry',
          company: company, name: name, email: email, phone: phone, role: role, message: msg, language: lang
        }, 'hireStatus', 'hireBtn', 'sent_hire');
        openMailto(`Hiring inquiry${company ? ': ' + company : ''}`, [
          `Company: ${company || '-'}`, `Contact person: ${name || '-'}`, `Email: ${email}`,
          `Phone: ${phone || '-'}`, `Role / hiring need: ${role || '-'}`, '', msg
        ]);
        setStatus('hireStatus', t('mail_open', state.contactEmail), 'ok');
      };
    }
    const applyBtn = document.getElementById('applyBtn');
    if (applyBtn){
      const fileInput = document.getElementById('applyFile');
      const fileName = document.getElementById('applyFileName');
      if (fileInput && fileName){
        fileInput.onchange = function(){
          const f = fileInput.files[0];
          if (f && f.size > 10 * 1024 * 1024){
            fileInput.value = '';
            fileName.textContent = t('nofile');
            return setStatus('applyStatus', t('e_big'), 'err');
          }
          fileName.textContent = f ? f.name : t('nofile');
          setStatus('applyStatus', '', 'ok');
        };
      }
      applyBtn.onclick = function(){
        const name = val('applyName'), email = val('applyEmail'), phone = val('applyPhone');
        const role = val('applyRole'), msg = val('applyMsg');
        const file = fileInput && fileInput.files[0];
        if (!name) return setStatus('applyStatus', t('e_apply_name'), 'err');
        if (!EMAIL_RE.test(email)) return setStatus('applyStatus', t('e_email_apply'), 'err');
        if (endpointOn()){
          let link = val('applyLink');
          if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
          return submitRemote({
            _subject: `Job application${role ? ': ' + role : ''}`, form_type: 'Job application',
            name: name, email: email, phone: phone, role: role, cv_link: link, message: msg, language: lang
          }, 'applyStatus', 'applyBtn', 'sent_apply');
        }
        const lines = [
          `Name: ${name}`, `Email: ${email}`, `Phone: ${phone || '-'}`,
          `Role interested in: ${role || '-'}`, '', msg
        ];
        if (file) lines.push('', `CV attached: ${file.name}. Please attach this file to this email before sending.`);
        openMailto(`Job application${role ? ': ' + role : ''}`, lines);
        setStatus('applyStatus', file
          ? t('mail_open_attach', file.name, state.contactEmail)
          : t('mail_open', state.contactEmail), 'ok');
      };
    }
  }

  let snapshot = null;

  function harvest(){
    document.querySelectorAll('[data-field]').forEach(el=>{
      const txt = el.textContent.replace(/\s+/g,' ').trim();
      if (txt) setByPath(state, tpath(el.getAttribute('data-field')), txt);
    });
  }

  function applyEditing(){
    document.body.classList.add('editing');
    document.querySelectorAll('[data-field]').forEach(el=>{
      el.contentEditable = 'true';
      if (el.dataset.wired) return;
      el.dataset.wired = '1';
      el.setAttribute('enterkeyhint', 'done');
      el.addEventListener('keydown', e=>{ if (editing && e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
      el.addEventListener('paste', e=>{
        if (!editing) return;
        e.preventDefault();
        const pasted = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\s+/g,' ');
        document.execCommand('insertText', false, pasted);
      });
      el.addEventListener('click', e=>{ if (editing) e.preventDefault(); });
    });
    const up = document.getElementById('imgUploadBtn');
    if (up) up.classList.remove('hidden');
  }

  function paintFab(){
    const fab = document.getElementById('editFab');
    if (!fab) return;
    if (!canEdit){ fab.innerHTML=''; return; }
    if (!editing){
      fab.innerHTML = `<button class="start" id="btnStart">✎ Edit page</button>`;
      document.getElementById('btnStart').onclick = startEdit;
    } else {
      fab.innerHTML = `<span class="status" id="status">Editing. Tap any highlighted text to change it.</span>
        <button class="cancel" id="btnCancel">Cancel</button>
        <button class="save" id="btnSave">Save changes</button>`;
      document.getElementById('btnCancel').onclick = cancelEdit;
      document.getElementById('btnSave').onclick = saveEdit;
    }
  }

  function startEdit(){
    snapshot = JSON.stringify(state);
    editing = true;
    applyEditing();
    paintFab();
  }

  function cancelEdit(){
    if (snapshot) state = JSON.parse(snapshot);
    snapshot = null;
    editing = false;
    document.body.classList.remove('editing');
    paint();
  }

  async function saveEdit(){
    harvest();
    const statusEl = document.getElementById('status');
    if (statusEl) statusEl.textContent = 'Saving…';
    try{
      const artifact = await claude.use('artifact');
      if (!artifact){ if(statusEl) statusEl.textContent = 'Could not save here.'; return; }
      await artifact.publish(renderDoc(state, getRoute()));
      snapshot = null;
      editing = false;
      document.body.classList.remove('editing');
      paint();
    }catch(e){
      if (statusEl) statusEl.textContent = 'Save failed. Try again.';
    }
  }

  function wireUploadButton(){
    const input = document.getElementById('imgInput');
    if (!input) return;
    input.onchange = async function(){
      const file = input.files[0];
      if (!file) return;
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.textContent = 'Uploading photo…';
      try{
        const assets = await claude.use('assets');
        if (!assets){ if(statusEl) statusEl.textContent='Uploads unavailable.'; return; }
        const res = await assets.upload(file);
        state.heroImageId = res.id;
        if (statusEl) statusEl.textContent = 'Photo added. Click Save changes';
        const bg = document.querySelector('.hero-bg');
        if (bg){ bg.classList.add('has-img'); bg.style.backgroundImage = `linear-gradient(0deg,rgba(15,20,18,.15),rgba(15,20,18,.15)),url('${res.url}')`; }
      }catch(e){
        if (statusEl) statusEl.textContent = 'Upload failed.';
      }
    };
  }

  let canEdit = false;
  window.addEventListener('hashchange', ()=>{ if (editing) harvest(); paint(); window.scrollTo({top:0, behavior:'instant'}); });

  async function init(){
    paint();
    try{
      const user = await claude.use('user');
      canEdit = !!(user && user.canEdit && user.canEdit());
    }catch(e){ canEdit = false; }
    paintFab();
  }
  init();
})();
</script>
</body>
</html>
